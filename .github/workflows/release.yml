name: Release new tagged version

# Runs when a v* tag is pushed. It can also be started by hand for an
# existing tag (Actions > "Release new tagged version" > Run workflow),
# for example to repeat the npm publish after a failure.
on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.5.0'
        required: true
        type: string

env:
  RELEASE_REF: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist/*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC), no token secret needed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org/'
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - name: Include dist/ folder (the build) in release
        run: |
          zip -r ${{ github.event.repository.name }}.zip *
      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          name: Release ${{ env.RELEASE_REF }}
          files: ./${{ github.event.repository.name }}.zip
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest && npm --version
      # --tag latest must be explicit: the registry still holds 0.25.x from the
      # old numbering scheme, which sorts above 0.x releases, and npm refuses
      # to move "latest" to a lower version implicitly.
      - name: Publish NPM Module
        run: npm publish --provenance --access public --tag latest

  publish-documentation:
    name: Publish documentation
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build debug version
        run: npm run build
      - name: Build documentation
        run: |
          cd docs
          npm ci
          npm run build
      # Required for hosting at js.org
      - name: Ensure CNAME is part of gh-pages
        run: echo "canvas-datagrid.js.org" > docs/build/CNAME
      - name: Publish documentation to GitHub pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          exclude_assets: '.gitignore,.github,node_modules'
          publish_dir: ./docs/build
