name: Release new tagged version

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist/*

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org/'
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist
      - name: Include dist/ folder (the build) in release
        run: |
          zip -r ${{ github.event.repository.name }}.zip *
      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: ./${{ github.event.repository.name }}.zip
      - name: Publish NPM Module
        uses: JS-DevTools/npm-publish@v3
        with:
          token: ${{ secrets.NPM_DEPLOY_KEY }}

  publish-documentation:
    name: Publish documentation
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build debug version
        run: npm run build
      - name: Build documentation
        run: |
          cd docs
          npm ci
          npm run build
      # Required for hosting at js.org
      - name: Ensure CNAME is part of gh-pages
        run: echo "canvas-datagrid.js.org" > docs/build/CNAME
      - name: Publish documentation to GitHub pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          exclude_assets: '.gitignore,.github,node_modules'
          publish_dir: ./docs/build
